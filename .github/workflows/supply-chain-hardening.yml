name: Supply Chain Hardening

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "scripts/supply_chain_scan.sh"
      - ".github/workflows/supply-chain-hardening.yml"
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ""

      - name: trufflehog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Lint backend Dockerfile
        run: hadolint backend/Dockerfile --no-fail

      - name: Lint frontend Dockerfile
        run: hadolint frontend/Dockerfile --no-fail

      - name: Check no latest tag in backend Dockerfile
        run: |
          if grep -qE 'FROM.*:latest' backend/Dockerfile; then
            echo "FAIL: backend Dockerfile uses :latest tag"
            exit 1
          fi
          echo "PASS: backend Dockerfile does not use :latest"

      - name: Check no latest tag in frontend Dockerfile
        run: |
          if grep -qE 'FROM.*:latest' frontend/Dockerfile; then
            echo "FAIL: frontend Dockerfile uses :latest tag"
            exit 1
          fi
          echo "PASS: frontend Dockerfile does not use :latest"

  sbom-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Sync backend dependencies
        run: uv sync --project backend --dev

      - name: Generate Python SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          path: backend
          format: spdx-json
          output-file: backend-sbom.spdx.json

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.spdx.json
          retention-days: 90

      - name: Run Trivy vulnerability scanner on backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          format: sarif
          output: trivy-backend-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-backend-results.sarif') != ''
        with:
          sarif_file: trivy-backend-results.sarif

      - name: Run OSV-Scanner on backend
        uses: google/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --lockfile=backend/uv.lock
            --format=sarif
            --output=osv-backend-results.sarif

      - name: Upload OSV-Scanner results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-scanner-backend-results
          path: osv-backend-results.sarif
          retention-days: 90

  frontend-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Generate frontend SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          path: frontend
          format: spdx-json
          output-file: frontend-sbom.spdx.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend-sbom.spdx.json
          retention-days: 90

      - name: Run Trivy vulnerability scanner on frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-frontend-results.sarif') != ''
        with:
          sarif_file: trivy-frontend-results.sarif

  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Sync backend dependencies
        run: uv sync --project backend --dev

      - name: Check Python license compliance
        run: |
          uv run --project backend pip-licenses \
            --format=json \
            --output-file=backend-licenses.json \
            --with-authors \
            --with-urls
        continue-on-error: true

      - name: Validate license allowlist
        run: |
          python scripts/check_license_allowlist.py backend-licenses.json .github/license-allowlist.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check frontend license compliance
        run: |
          npx --prefix frontend license-checker \
            --json \
            --out frontend-licenses.json \
            --start frontend

      - name: Validate frontend license allowlist
        run: |
          python scripts/check_license_allowlist.py frontend-licenses.json .github/license-allowlist.json

  backend-slsa-provenance:
    needs: [secret-scan, dockerfile-lint, sbom-and-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend/
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          provenance: false

      - name: Export backend digest
        id: digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  backend-slsa-generator:
    needs: [backend-slsa-provenance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.backend-slsa-provenance.outputs.image }}
      digest: ${{ needs.backend-slsa-provenance.outputs.digest }}
      registry-username: ${{ github.actor }}

  frontend-slsa-provenance:
    needs: [secret-scan, dockerfile-lint, frontend-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          provenance: false

      - name: Export frontend digest
        id: digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  frontend-slsa-generator:
    needs: [frontend-slsa-provenance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.frontend-slsa-provenance.outputs.image }}
      digest: ${{ needs.frontend-slsa-provenance.outputs.digest }}
      registry-username: ${{ github.actor }}

  image-signing:
    needs: [backend-slsa-provenance, frontend-slsa-provenance, license-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3

      - name: Download backend SBOM
        uses: actions/download-artifact@v4
        with:
          name: backend-sbom

      - name: Download frontend SBOM
        uses: actions/download-artifact@v4
        with:
          name: frontend-sbom

      - name: Sign backend image with cosign keyless
        env:
          BACKEND_IMAGE: "ghcr.io/${{ github.repository }}/backend@${{ needs.backend-slsa-provenance.outputs.digest }}"
        run: |
          cosign sign --yes "$BACKEND_IMAGE"

      - name: Attach SBOM to backend image
        env:
          BACKEND_IMAGE: "ghcr.io/${{ github.repository }}/backend@${{ needs.backend-slsa-provenance.outputs.digest }}"
        run: |
          cosign attach sbom "$BACKEND_IMAGE" \
            --sbom backend-sbom.spdx.json \
            --sbom-type spdxjson

      - name: Sign frontend image with cosign keyless
        env:
          FRONTEND_IMAGE: "ghcr.io/${{ github.repository }}/frontend@${{ needs.frontend-slsa-provenance.outputs.digest }}"
        run: |
          cosign sign --yes "$FRONTEND_IMAGE"

      - name: Attach SBOM to frontend image
        env:
          FRONTEND_IMAGE: "ghcr.io/${{ github.repository }}/frontend@${{ needs.frontend-slsa-provenance.outputs.digest }}"
        run: |
          cosign attach sbom "$FRONTEND_IMAGE" \
            --sbom frontend-sbom.spdx.json \
            --sbom-type spdxjson

      - name: Upload signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: signing-evidence
          path: |
            backend-sbom.spdx.json
            frontend-sbom.spdx.json
          retention-days: 90
