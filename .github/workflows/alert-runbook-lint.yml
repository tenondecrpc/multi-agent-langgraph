name: Alert Runbook Lint

on:
  pull_request:
    paths:
      - "docs/alerts/**"
      - "docs/runbooks/**"
      - "scripts/lint_alert_runbooks.py"
      - ".github/workflows/alert-runbook-lint.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Lint alert runbook links
        run: >
          uv run --project backend python scripts/lint_alert_runbooks.py
          --alerts-dir docs/alerts
          --runbooks-dir docs/runbooks
