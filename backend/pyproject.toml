[project]
name = "backend"
version = "0.1.0"
description = "Backend runtime backbone for LangGraph Dev Squad."
readme = "README.md"
authors = [
    { name = "Cristian Paniagua", email = "tenondecrpc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "arq>=0.26,<0.27",
    "asyncpg>=0.31.0",
    "fastapi>=0.115,<0.116",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3,<4",
    "pydantic>=2.12,<3",
    "redis[hiredis]>=5,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.scripts]
backend = "backend.app:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115,<0.116",
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
