apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dev-squad-backend-egress
spec:
  podSelector:
    matchLabels:
      app: dev-squad-backend
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.denyExternalLlmEgress }}
    - to:
        - podSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.internalEmbedding.podSelector | indent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.internalEmbedding.port }}
    {{- else }}
    - to:
        {{- range .Values.networkPolicy.allowedCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
