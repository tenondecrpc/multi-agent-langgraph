apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreName }}
spec:
  provider:
    vault:
      server: https://vault.example.internal
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: dev-squad-backend
