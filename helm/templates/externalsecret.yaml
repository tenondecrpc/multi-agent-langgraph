{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dev-squad-persistence
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: dev-squad-persistence
  data:
    - secretKey: {{ .Values.database.urlKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath }}
        property: database_url
    - secretKey: {{ .Values.redis.urlKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath }}
        property: redis_url
    - secretKey: {{ .Values.encryption.wrappingKeyKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath }}
        property: wrapping_key
    {{- if .Values.langsmith.enabled }}
    - secretKey: {{ .Values.langsmith.apiKeySecretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath }}
        property: {{ .Values.langsmith.vaultProperty }}
    {{- end }}
{{- end }}
