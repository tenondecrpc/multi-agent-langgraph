apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-signature
  annotations:
    policies.kyverno.io/title: Require Image Signature
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      All container images must be signed with cosign keyless.
      Unsigned images are rejected at admission.
spec:
  validationFailureAction: {{ .Values.admission.signature.enforce | default "Audit" }}
  background: false
  webhookTimeoutSeconds: 10
  failurePolicy: Fail
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/{{ .Values.repository.owner }}/{{ .Values.repository.name }}/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: {{ .Values.cosign.rekorURL | default "https://rekor.sigstore.dev" }}
