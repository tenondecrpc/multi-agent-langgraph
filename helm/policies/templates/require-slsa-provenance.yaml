apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-slsa-provenance
  annotations:
    policies.kyverno.io/title: Require SLSA Provenance
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      All container images must have an attached SLSA Level 3 provenance attestation.
spec:
  validationFailureAction: {{ .Values.admission.provenance.enforce | default "Audit" }}
  background: false
  webhookTimeoutSeconds: 10
  failurePolicy: Fail
  rules:
    - name: check-slsa-provenance
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "*"
          attestations:
            - predicateType: https://slsa.dev/provenance/v1
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/{{ .Values.repository.owner }}/{{ .Values.repository.name }}/.github/workflows/*"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: {{ .Values.cosign.rekorURL | default "https://rekor.sigstore.dev" }}
