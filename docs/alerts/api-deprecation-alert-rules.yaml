groups:
  - name: api-deprecation-alerts
    rules:
      - alert: ApiDeprecatedRouteTrafficNearSunset
        expr: |
          (
            sum by (route, version, tenant_id) (
              increase(devsquad_api_deprecation_hits_total[24h])
            ) > 0
          )
          and on (route, version)
          (
            devsquad_api_deprecation_sunset_days <= 60
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Deprecated API route still has traffic within 60 days of sunset.
          description: Tenant {{ $labels.tenant_id }} is still calling {{ $labels.route }} {{ $labels.version }}.
