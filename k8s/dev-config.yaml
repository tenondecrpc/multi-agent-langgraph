# Development ConfigMap - non-sensitive defaults for local Minikube.
# The Makefile target `make minikube-secrets` generates the companion Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-squad-backend-config
data:
  BACKEND_DEPLOYMENT_PROFILE: "connected"
  BACKEND_PROVIDER_OPENCODE_GO_ENDPOINT: "http://dev-squad-opencode-go:8080/v1"
  BACKEND_ENCRYPTION_PROVIDER: "local"
  BACKEND_ENCRYPTION_ACTIVE_KEY_ID: "kek-dev-v1"
  BACKEND_ENCRYPTION_PREVIOUS_KEY_IDS: ""
  INTERNAL_RAG_ENABLED: "false"
  DO_NOT_TRACK: "1"
  LANGCHAIN_TRACING_V2: "false"
---
# Placeholder Secret - values are overwritten by `make minikube-secrets`.
# Do not commit real keys here. The Makefile generates safe dev defaults.
apiVersion: v1
kind: Secret
metadata:
  name: dev-squad-backend-secret
type: Opaque
data:
  # Base64-encoded dev Fernet key. Regenerated by `make minikube-secrets`.
  BACKEND_ENCRYPTION_ACTIVE_WRAPPING_KEY: ZGV2LWZlcm5ldC1rZXktcmVwbGFjZS1tZQ==
  # Base64-encoded dev webhook secret. Regenerated by `make minikube-secrets`.
  BACKEND_WEBHOOK_SHARED_SECRET: ZGV2LXdlYmhvb2stc2VjcmV0LXJlcGxhY2UtbWU=
  # Placeholder database URL (backend starts without it; persistence will be "not configured").
  BACKEND_DATABASE_URL: cG9zdGdyZXNxbDovL25vdC1jb25maWd1cmVk
  # Placeholder Redis URL (backend starts without it; queue will be "not configured").
  BACKEND_REDIS_URL: cmVkaXM6Ly9ub3QtY29uZmlndXJlZA==
