apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: langgraph-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dev-squad-backend-config
          env:
            - name: BACKEND_ENCRYPTION_ACTIVE_WRAPPING_KEY
              valueFrom:
                secretKeyRef:
                  name: dev-squad-backend-secret
                  key: BACKEND_ENCRYPTION_ACTIVE_WRAPPING_KEY
            - name: BACKEND_WEBHOOK_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: dev-squad-backend-secret
                  key: BACKEND_WEBHOOK_SHARED_SECRET
            - name: BACKEND_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dev-squad-backend-secret
                  key: BACKEND_DATABASE_URL
            - name: BACKEND_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dev-squad-backend-secret
                  key: BACKEND_REDIS_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
